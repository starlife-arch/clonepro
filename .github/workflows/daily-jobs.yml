name: Daily Scheduled Jobs

on:
  schedule:
    - cron: '0 6 * * *'   # 6:00 AM UTC daily = 9:00 AM EAT
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  apply-loan-penalties:
    runs-on: ubuntu-latest
    steps:
      - name: Apply Loan Penalties
        run: |
          curl -s -X POST "${{ secrets.VERCEL_SITE_URL }}/api/apply-loan-penalties" \
            -H "Content-Type: application/json" \
            -d "{}" \
            --max-time 30
        continue-on-error: true

  renew-msg-alerts:
    runs-on: ubuntu-latest
    needs: apply-loan-penalties
    steps:
      - name: Renew Message Alert Subscriptions
        run: |
          curl -s -X POST "${{ secrets.VERCEL_SITE_URL }}/api/renew-msg-alerts" \
            -H "Content-Type: application/json" \
            -d "{}" \
            --max-time 30
        continue-on-error: true

  daily-report:
    runs-on: ubuntu-latest
    needs: renew-msg-alerts
    steps:
      - name: Generate Daily Report
        run: |
          curl -s -X POST "${{ secrets.VERCEL_SITE_URL }}/api/daily-report" \
            -H "Content-Type: application/json" \
            -d "{}" \
            --max-time 30
        continue-on-error: true

  held-balance-check:
    runs-on: ubuntu-latest
    needs: daily-report
    steps:
      - name: Check Held Balance Misuse
        run: |
          curl -s -X POST "${{ secrets.VERCEL_SITE_URL }}/api/held-balance-misuse-check" \
            -H "Content-Type: application/json" \
            -d "{}" \
            --max-time 30
        continue-on-error: true

  detect-duplicates:
    runs-on: ubuntu-latest
    needs: held-balance-check
    steps:
      - name: Detect Duplicate Investments
        run: |
          curl -s -X POST "${{ secrets.VERCEL_SITE_URL }}/api/detect-duplicate-investments" \
            -H "Content-Type: application/json" \
            -d "{}" \
            --max-time 30
        continue-on-error: true
