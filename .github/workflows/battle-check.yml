name: Battle Royale Room Check

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:

jobs:
  check-battle-rooms:
    runs-on: ubuntu-latest
    steps:
      - name: Check Battle Rooms
        run: |
          curl -s -X POST "${{ secrets.VERCEL_SITE_URL }}/api/battle-check-rooms" \
            -H "Content-Type: application/json" \
            -d "{}" \
            --max-time 30
        continue-on-error: true
