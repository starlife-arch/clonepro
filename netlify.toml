[build]
  publish = "/"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions."apply-loan-penalties"]
  schedule = "@daily"

[functions."renew-msg-alerts"]
  schedule = "0 6 * * *"

[[redirects]]
  from = "/pesapal-callback"
  to = "/index.html"
  status = 200

[functions."battle-check-rooms"]
  schedule = "*/2 * * * *"
